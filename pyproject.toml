[project]
name = "animas-gold-king"
version = "0.1.0"
description = "Animas River after Gold King: a flow-adjusted interrupted time series on public USGS and Water Quality Portal data, run under the cairn harness."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Ethan Levy", email = "ethannol@gmail.com" }]
dependencies = [
    "cairn",
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.uv.sources]
cairn = { path = "../cairn", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/animas"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
